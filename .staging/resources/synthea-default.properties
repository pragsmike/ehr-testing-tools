# The zero-flag default Synthea configuration for `ehr corpus generate`
# (D9, docs/source-sink-design.md Part IX.2; ADR-0019). This file is part
# of the reproducibility pin: it is one of the fixed inputs the zero-flag
# acceptance property ("ehr corpus generate with no flags is
# byte-reproducible") holds constant, alongside the pinned seed,
# reference-date, population, and locked Synthea/JDK artifact versions.
# Change-controlled -- editing this file's content IS a behavior change
# to the zero-flag run, not a cosmetic edit.
#
# Content is deliberately minimal: exactly the exporters the quickstart's
# first command and `ehr gate fhir` need, and nothing else -- FHIR R4 is
# the only export format on, matching config/synthea/synthea.properties
# (the explicit-flags config this repo's tests and EXP-A4 already use),
# from which this file's exporter selection was probed and confirmed
# still current against the pinned Synthea 4.0.0 distribution.

exporter.fhir.export = true
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.text.export = false
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

generate.thread_pool_size = 1
