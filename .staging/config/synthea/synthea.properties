# Repo-authored Synthea configuration (ADR-0005: repo-owned text, not a
# locked artifact -- referenced by manifests via path + content-hash).
# Kept minimal: pins exactly the exporters this repo currently consumes,
# explicit rather than relying on Synthea's own defaults (which could
# change between versions). FHIR R4 is the only export format on.
#
# The reference date is deliberately NOT here: Synthea only accepts it as
# a CLI flag (-r YYYYMMDD), not a properties key (checked against
# synthea.properties in the v4.0.0 distribution). corpus.generate always
# passes -r explicitly -- see ehr-testing-tools.corpus.generate.
#
# Single-threaded by default (matches EXP-A4's baseline round); the
# parallelism variation round overrides this via --generate.thread_pool_size
# on the command line, not by editing this file.

exporter.fhir.export = true
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.text.export = false
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

generate.thread_pool_size = 1
