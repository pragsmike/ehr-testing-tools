# Poly-gated CI, ported from ehr-testing-sim's own minimal workflow
# (notes/sim/ADRs.md ADR-0015's own trigger) to the workspace's own
# tool: checkout + Clojure CLI + Temurin 21 (matching sim's CI
# convention, notes/ADRs.md ADR-0001's own environment-stanza
# distinction between that and local dev's stock OpenJDK) + `poly
# check` + the per-push test lane.
#
# Per-push lane = ENF-1's fast gate, restored (ADR-0004, 2026-07-28,
# carve-loss recovery session; original doctrine:
# notes/tools/prompts/2026-07-25-enf1-enforcement-wave.md): every brick
# suite plus projects/conformance's own test/ tree, explicitly excluding
# projects/integration -- the project that holds every namespace
# requiring `ehr artifact fetch` machinery (synthea, temurin-jdk,
# fhir-validator-cli), absent from this runner's cold clone.
# `skip:integration` (poly's own project-exclusion mechanism, `poly help`)
# is verified, not assumed, to exclude exactly that project while
# `:all` still runs every other brick and project test, conformance's
# own test/ tree included -- pinned empirically this session, not taken
# on ADR-0002's earlier word alone. The dropped third `poly test
# :project` step (pre-ADR-0004) existed only to guard against `:all`
# silently skipping conformance's own tests, a gap `:all skip:integration`
# doesn't have (verified the same way); `:project`'s own incremental
# "changed since last stable-* tag" scope would in any case be a
# *narrower* check than `:all skip:integration`'s comprehensive one, not
# a stronger belt-and-suspenders pass.
#
# `projects/integration`'s own suite runs on a separate, scheduled +
# workflow_dispatch lane (.github/workflows/integration.yml) that primes
# the artifact cache first -- reports, never blocks a merge.
#
# No coverage gate, no lint gate, same deliberately-staged posture as
# sim's own CI comment: not an oversight, future work once a baseline
# exists to ratchet against.
#
# Generated-doc freshness (P1-2, 2026-07-31 review catch-up, finding
# 10a): `make docsgen` regenerates docs/dev/pipeline.md, docs/use-cases.md,
# docs/operators.md, and docs/cli.md from their component-adjacent EDN/
# spec sources; `git diff --exit-code` on exactly those four files fails
# the build the moment a source edit lands without its regen in the same
# commit. `pipeline`/`use-cases` shell out to
# components/palgebra/tools/resource_equations_to_mermaid.py, so
# actions/setup-python below is not incidental -- ubuntu-latest ships a
# python3, but this pins the dependency explicitly rather than relying
# on the runner image's own default.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # poly's changed/affected diffing needs tag history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: poly check
        run: clojure -M:poly check

      - name: poly test :all skip:integration
        run: clojure -M:poly test :all skip:integration

      - name: generated-doc freshness (regen + diff)
        run: |
          make docsgen
          git diff --exit-code docs/dev/pipeline.md docs/use-cases.md docs/operators.md docs/cli.md
