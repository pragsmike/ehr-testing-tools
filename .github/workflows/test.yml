# Poly-gated CI, ported from ehr-testing-sim's own minimal workflow
# (notes/sim/ADRs.md ADR-0015's own trigger) to the workspace's own
# tool: checkout + Clojure CLI + Temurin 21 (matching sim's CI
# convention, notes/ADRs.md ADR-0001's own environment-stanza
# distinction between that and local dev's stock OpenJDK) + `poly
# check` + the per-push test lane.
#
# Per-push lane = ENF-1's fast gate, restored (ADR-0004, 2026-07-28,
# carve-loss recovery session; original doctrine:
# notes/tools/prompts/2026-07-25-enf1-enforcement-wave.md): every brick
# suite plus projects/conformance's own test/ tree, explicitly excluding
# projects/integration -- the project that holds every namespace
# requiring `ehr artifact fetch` machinery (synthea, temurin-jdk,
# fhir-validator-cli), absent from this runner's cold clone.
# `skip:integration` (poly's own project-exclusion mechanism, `poly help`)
# is verified, not assumed, to exclude exactly that project while
# `:all` still runs every other brick and project test, conformance's
# own test/ tree included -- pinned empirically this session, not taken
# on ADR-0002's earlier word alone. The dropped third `poly test
# :project` step (pre-ADR-0004) existed only to guard against `:all`
# silently skipping conformance's own tests, a gap `:all skip:integration`
# doesn't have (verified the same way); `:project`'s own incremental
# "changed since last stable-* tag" scope would in any case be a
# *narrower* check than `:all skip:integration`'s comprehensive one, not
# a stronger belt-and-suspenders pass.
#
# `projects/integration`'s own suite runs on a separate, scheduled +
# workflow_dispatch lane (.github/workflows/integration.yml) that primes
# the artifact cache first -- reports, never blocks a merge.
#
# No coverage gate, no lint gate, same deliberately-staged posture as
# sim's own CI comment: not an oversight, future work once a baseline
# exists to ratchet against.
#
# Generated-doc freshness (P1-2, 2026-07-31 review catch-up, finding
# 10a): `make docsgen` regenerates docs/dev/pipeline.md, docs/use-cases.md
# (the generated index) plus docs/use-cases/*.md (one page per case,
# migration item 14, 2026-08-02), docs/operators.md, and docs/cli.md
# from their component-adjacent EDN/spec sources; `git diff --exit-code`
# on exactly those paths fails the build the moment a source edit lands
# without its regen in the same commit. `pipeline`/`use-cases` shell out
# to components/palgebra/tools/resource_equations_to_mermaid.py, so
# actions/setup-python below is not incidental -- ubuntu-latest ships a
# python3, but this pins the dependency explicitly rather than relying
# on the runner image's own default.
#
# Population widened 2026-08-15 (review 3, D2-4/D5-3/D5-4, ADR-0136)
# from five paths to ten. The five it diffed were exactly the five the
# make graph knew about; a tree-first enumeration found five more
# derived artifacts with no gate of any kind, three of them already
# stale against their own converter. The lesson is the gate's, not the
# artifacts': a freshness step whose population is the make graph
# cannot see a derivation that was never added to the make graph. Both
# surfaces are now enumerated from the tree -- if a new derived file
# appears, it goes on a make target AND on the diff list below, same
# commit.
#
# Population widened again 2026-08-16 (compression arc session A,
# notes/adr/0143-adr-index-generated.md) by one path: notes/ADRs.md,
# the ADR index, which stopped being hand-edited that day. It is the
# first REGISTER on this list rather than a derived doc -- the reason
# it joined is the same one the ten above are here for, applied to a
# file whose shape decayed instead of going stale: rows ruled to be one
# line in ADR-0046 had grown to 977 characters on average because
# nothing regenerated them. `ehrt.docs-tooling.adr-index-test` asserts
# the same parity in the normal suite, so a hand edit fails before it
# reaches a push; this step is the second lock.
#
# Population widened again 2026-08-17 (ADR-0149) by one path:
# demos/traces/ -- the last ungated derived-artifact tree in the repo.
# Its seven messages*.txt, six ground-truth.edn and one FHIR bundle are
# produced by `bin/ehrt sim run` and were regenerated by nothing, so
# they drifted silently and did: ADR-0142 found one captured before PV1
# grew its trailing positional fields, and ADR-0149 found another that
# had never been its own README command's output at all. `make traces`
# (a new docsgen leaf, bin/regen-traces) reruns each trace README's own
# fenced commands verbatim; this step is what compares the result.
#
# NOTE on cost: `traces` is by far the slowest docsgen leaf -- eleven
# `bin/ehrt sim run` starts plus one materializing JVM, all of it on
# every push. ADR-0149 records the measured wall clock and the tier
# reasoning behind keeping it here rather than on `make integration`.
#
# The rule stated at the top of this block is the one that matters and
# is now MECHANICAL, not prose: `ehrt.docs-tooling.traces-fresh-test`
# asserts that `docsgen` depends on `traces` and that this diff list
# names demos/traces/. Every earlier widening here was hand-maintained.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # poly's changed/affected diffing needs tag history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: poly check
        run: clojure -M:poly check

      - name: poly test :all skip:integration
        run: clojure -M:poly test :all skip:integration

      - name: verify-nist-lock (supply-chain integrity)
        run: bin/verify-nist-lock

      - name: generated-doc freshness (regen + diff)
        run: |
          make docsgen
          git diff --exit-code \
            docs/dev/pipeline.md \
            docs/use-cases.md \
            docs/use-cases/ \
            docs/operators.md \
            docs/cli.md \
            docs/formats.md \
            components/sim-engine/resources/sim-engine/event-schema.edn \
            components/sim-engine/resources/sim-engine/event-examples.edn \
            components/sim/docs/sim-theory-diagram.md \
            components/sim/docs/sim-theory-diagram.mermaid \
            components/palgebra/examples/ai-study-flow-v3.mermaid \
            components/palgebra/examples/committee-flow.mermaid \
            components/palgebra/examples/deliberated-choice-flow.mermaid \
            notes/ADRs.md \
            .agents/state-derived.md \
            .agents/session-records/INDEX.md \
            .agents/prompts/INDEX.md \
            demos/traces/
