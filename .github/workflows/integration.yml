# Nightly/manual integration workflow (ENF-1, enforcement wave,
# 2026-07-25). Runs `make integration` -- the suite under
# test-integration/ that needs real cached artifacts, network, and a
# warm cache (e.g. judge.fhir's contract-pairing suite against the real
# validator_cli.jar subprocess) -- which AGENTS.md's hermeticity policy
# deliberately keeps off the per-push `make test`/`make coverage` path
# (.github/workflows/ci.yml). This workflow is that suite's only CI
# home: scheduled nightly plus on-demand via workflow_dispatch, never on
# push/PR, and its failure reports without blocking anything -- nothing
# in this repo's branch protection or ci.yml references this workflow's
# status, so there is no merge for it to block.
#
# DOC-5 (2026-07-26) added `make quickstart-demo` below, after cache
# priming: README.md's Quickstart, run verbatim and asserted, against
# real artifacts -- the slow half of the executable-quickstart pair
# (the fast half, quickstart-fresh, lives in ci.yml and never runs
# either the README or the script). Same non-blocking contract as
# `make integration`: this job's own failure is the enforcement.
#
# ADR-0013 (2026-07-26) added four sim_*_test.clj entry points under
# test-integration/ -- ehr-testing-tools' first cross-repo consumer loop
# against ehr-testing-sim, consumed only as a `../ehr-testing-sim`
# sibling-checkout subprocess, never a classpath or deps.edn dependency
# (ADR-0013 decision 1). At the time this comment was first written,
# that repo was private and this runner had no sibling checkout, so
# every one of those four tests took its own clean-skip path
# (sim-harness/available? false) every night, by design, not an
# oversight. ehr-testing-sim went public 2026-07-27 (its own ADR-0015),
# which is what makes the "Checkout sibling ehr-testing-sim" step below
# possible without a credential this runner isn't given -- added for the
# palgebra drift check (below), not to newly exercise the four
# sim_*_test.clj tests themselves; whether those should now run for real
# against the same checkout is a separate call for a future session, not
# decided here.
#
# Cold-cache fetch, what and from where: three artifacts, all GitHub
# release assets, all license-verified in notes/facts-register.md --
# synthea 4.0.0 (Apache-2.0, F2), temurin-jdk 17.0.19+10 (GPLv2 +
# Classpath Exception, F12), fhir-validator-cli 6.9.12 (Apache-2.0,
# F5/F18). None of artifacts.lock.edn's current entries are NIST-origin
# coordinates or touch hit-nexus.nist.gov (F14) -- that dependency would
# only arise if this repo later adopts the CDC/NIST v2-validation engine
# (EXP-D3), still blocked on the NIST license inquiry (F1/F15), and is
# NOT part of what this job fetches today. F14's volatility note is
# cited here for the general principle it establishes, not a literal
# dependency: a job's cold-cache fetch depends on a live external
# distribution point (GitHub's release-asset hosting, in this job's
# actual case) rather than version-controlled state, so an outage of
# that point fails this job -- and that failure is signal about artifact
# availability, not CI flakiness to retry around.
name: Integration

on:
  schedule:
    # 07:00 UTC -- outside US/EU working hours, a quiet window for a job
    # whose failures are investigated the next morning, not paged on.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure/Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      # Engine-artifact cache (ADR-0005): keyed on artifacts.lock.edn's
      # own hash, so a version/hash bump in the lockfile invalidates it
      # automatically. Populates ~/.cache/ehr-testing-tools/artifacts --
      # the default cache-dir ehr-testing-tools.artifact/cache-dir
      # resolves to when EHR_TESTING_TOOLS_CACHE is unset (src/
      # ehr_testing_tools/artifact.clj), covering both raw downloads
      # (keyed by sha256) and resolve-and-extract's extracted/<sha256>
      # subdirectories (e.g. the JDK and Synthea tarballs' unpacked
      # form). A cache hit makes `ehr artifact fetch` below a no-network
      # no-op (artifact/fetch short-circuits once cached-and-verified?
      # is true); a cache miss means every fetch below hits the network
      # for real -- see the header comment above for exactly what that
      # is and isn't.
      - name: Cache artifact cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ehr-testing-tools/artifacts
          key: ${{ runner.os }}-artifacts-${{ hashFiles('artifacts.lock.edn') }}

      - name: Prime artifact cache (synthea, temurin-jdk, fhir-validator-cli)
        run: |
          make ehr ARGS="artifact fetch --name synthea --version 4.0.0"
          make ehr ARGS="artifact fetch --name temurin-jdk --version 17.0.19+10"
          make ehr ARGS="artifact fetch --name fhir-validator-cli --version 6.9.12"

      # DOC-5: the slow half of the executable-quickstart pair. Runs
      # README.md's Quickstart fence verbatim (bin/quickstart-demo, via
      # `make quickstart-demo`) under per-step exit-code assertions plus
      # a tree-clean postcondition -- the fast half (ci.yml's
      # quickstart-fresh) only proves this script and the README agree
      # on what to run, never runs either. Against this job's warm cache
      # (the priming step above), the script's own artifact-fetch lines
      # are no-ops; cold, they do the real fetch -- both are correct, per
      # the cache-honesty ruling. Timeout is generous relative to the
      # measured warm-clone wall time (2m42-47s, DOC-5 Step 1's own
      # evidence, dominated by the ~90s real `gate fhir` run): a
      # GitHub-hosted runner and a cold cache can both be slower than a
      # local warm run.
      - name: make quickstart-demo
        timeout-minutes: 15
        run: make quickstart-demo

      - name: make integration
        run: make integration

      # Sibling checkout for the palgebra drift check below (ehr-testing-sim
      # went public 2026-07-27, its own ADR-0015, so a plain unauthenticated
      # clone works -- no deploy key/token needed). Lands at `../ehr-testing-sim`
      # relative to this job's own checkout, the same sibling-checkout path
      # ADR-0013's sim-harness already assumes (test-integration/
      # ehr_testing_tools/sim_harness.clj's `sim-repo-dir`), so no new path
      # convention is introduced here.
      - name: Checkout sibling ehr-testing-sim
        run: git clone --depth 1 https://github.com/pragsmike/ehr-testing-sim.git ../ehr-testing-sim

      # Nightly drift check (ehr-testing-sim's ADR-0016): this repo's
      # authoritative palgebra/ files vs. the copies vendored into that
      # repo's string-diagram skill. See bin/check-palgebra-drift for the
      # comparison itself and its failure message.
      - name: make check-palgebra-drift
        run: make check-palgebra-drift
