  plus the same section's own "A straddling encounter" prose:
  Hernandez, Sandra (MRN000002)'s admission (A01) transmits at
  2026-08-11T00:37:39Z, landing in batch-000; her discharge (A03)
  transmits at 2026-08-11T02:13:46Z, landing in batch-002. Both
