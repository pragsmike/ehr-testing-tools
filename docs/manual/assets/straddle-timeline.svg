  REDRAWN 2026-08-26 (arc 3a part 4, ADR-0173 ruling D1's commit 2): the
  demographic-fold opt-in reshuffled every draw. MRN000002 — the same
  ORDINAL — became Hernandez, Sandra, still admitting at 00:37:39Z and
