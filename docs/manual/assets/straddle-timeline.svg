<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="One encounter bar for Hernandez, Sandra (MRN000002) crossing two batch boundaries, with three batch windows drawn individually clean and the middle window holding neither end of the encounter">

  <rect x="0" y="0" width="640" height="280" fill="#ffffff" />

  <text x="40" y="30" font-size="15" font-weight="600" fill="#22314f">Hernandez, Sandra (MRN000002) — three clean files, the middle one holds neither half</text>

  <!-- Batch window boxes -->
  <rect x="40" y="170" width="186" height="60" rx="6" fill="#eaf3ea" stroke="#22492a" stroke-width="2" />
  <rect x="226" y="170" width="186" height="60" rx="6" fill="#eaf3ea" stroke="#22492a" stroke-width="2" />
  <rect x="412" y="170" width="186" height="60" rx="6" fill="#eaf3ea" stroke="#22492a" stroke-width="2" />
  <text x="133" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#22492a">batch-000.hl7</text>
  <text x="133" y="213" text-anchor="middle" font-size="11" fill="#3d6b46">[00:00Z, 01:00Z) — 5/5 verified</text>
  <text x="319" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#22492a">batch-001.hl7</text>
  <text x="319" y="213" text-anchor="middle" font-size="11" fill="#3d6b46">[01:00Z, 02:00Z) — 9/9 verified</text>
  <text x="505" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#22492a">batch-002.hl7</text>
  <text x="505" y="213" text-anchor="middle" font-size="11" fill="#3d6b46">[02:00Z, 03:00Z) — 16/16 verified</text>

  <!-- Wall-clock boundaries, cutting through both the windows and the encounter bar -->
  <line x1="226" y1="90" x2="226" y2="230" stroke="#8a2f2f" stroke-width="2" stroke-dasharray="5 4" />
  <text x="226" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#8a2f2f">01:00Z</text>
  <line x1="412" y1="90" x2="412" y2="230" stroke="#8a2f2f" stroke-width="2" stroke-dasharray="5 4" />
  <text x="412" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#8a2f2f">02:00Z</text>
  <text x="319" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#8a2f2f">two batch boundaries crossed</text>

  <!-- Encounter bar: admission to discharge, transmit-time positions -->
  <line x1="157" y1="120" x2="455" y2="120" stroke="#22314f" stroke-width="6" stroke-linecap="round" />
  <circle cx="157" cy="120" r="7" fill="#22314f" />
  <circle cx="455" cy="120" r="7" fill="#22314f" />
  <text x="157" y="105" text-anchor="middle" font-size="12" fill="#22314f">admitted A01</text>
  <text x="157" y="145" text-anchor="middle" font-size="11" fill="#44506b">00:37:39Z</text>
  <text x="455" y="105" text-anchor="middle" font-size="12" fill="#22314f">discharged A03</text>
  <text x="455" y="145" text-anchor="middle" font-size="11" fill="#44506b">02:13:46Z</text>

  <!-- Ties from encounter-bar endpoints down into their own batch window -->
  <line x1="157" y1="127" x2="157" y2="170" stroke="#22314f" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="455" y1="127" x2="455" y2="170" stroke="#22314f" stroke-width="1" stroke-dasharray="2 2" />

  <!-- The middle window carries neither end -->
  <text x="319" y="248" text-anchor="middle" font-size="11" font-style="italic" fill="#8a2f2f">no MRN000002 message at all</text>

  <text x="319" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#333">transport-complete, individually — clinically half-there, all three files together</text>
</svg>
