  "Batched delivery" section and its witnessed batch listing
  (interval-ms 3600000; batch-000 start-ms 1786406400000 / end-ms
  1786410000000 = [2026-08-11T00:00Z, 01:00Z); batch-001 start-ms
  1786410000000 / end-ms 1786413600000 = [01:00Z, 02:00Z)) plus the
  same section's own "A straddling encounter" prose: Smith, James
  (MRN000002)'s admission (A01) transmits at 2026-08-11T00:30:26Z,
  landing in batch-000; his discharge (A03) transmits at
  2026-08-11T01:34:19Z, landing in batch-001. Both timestamps
