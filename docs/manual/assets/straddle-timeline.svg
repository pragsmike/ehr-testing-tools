  REDRAWN 2026-08-27 (arc 3b sweep 2, ADR-0174 section 2(c)'s turn-on
  commit cb81dff), and THIS TIME THE DEPICTED FACT CHANGED — the first
  of the four redraws for which that is true, so it is said first. The
  bed-cycle opt-in reshuffled this run and redrew MRN000002's discharge
  its own sampled transmit delay: 01:59:02Z became 02:13:46Z, which
  crosses a SECOND batch boundary. The encounter no longer spans two
  ADJACENT files — it spans THREE, and the middle one carries neither
  half of it (verified directly: batch-001.hl7 contains no MRN000002
  message at all). The drawing gained a third window and a second
  boundary line for that reason, and its title moved from "two clean
  files" to "three clean files, and the middle one holds neither half".

  That is a STRONGER version of the lesson the cited section teaches,
  not a weaker one: a receiver holding batch-000 AND batch-001 — two
  consecutive, individually BTS-verified files — still has only half
  the encounter. Counts moved with it: batch-000 2 -> 5, batch-001
  4 -> 9, and batch-002 carries 16. The admission's own transmit time,
  00:37:39Z, has not moved across any of the four redraws.

  REDRAWN 2026-08-26 (arc 3b sweep 1, ADR-0174 ruling A1): reviewed and
  NOT redrawn — every value this diagram depicts survived the encounter
  horizon's lift untouched, because the encounter it draws is
  MRN000002's FIRST and a first encounter is exactly what that lift does
