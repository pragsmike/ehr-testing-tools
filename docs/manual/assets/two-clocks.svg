<?xml version="1.0" encoding="UTF-8"?>
<!--
  Content derived from docs/dev/simulator-architecture.md section 5
  (the latency second clock, GT x LatencyParams to TimedWire) and its
  own field audit: exactly two timestamp-bearing fields this
  workspace's emitter renders today are MSH-7 (message/transmit time,
  shiftable by a sampled delay) and EVN-2 (event/clinical time, ADT
  only, never shifted). The single message instance drawn below --
  Walker, William (MRN000013)'s own admission message (ADT^A01),
  EVN-2 2026-08-11T03:36:00Z / MSH-7 2026-08-11T04:36:46Z -- is the
  exact instance demos/scenarios/ed-tuesday/README.md's "The second
  clock" section narrates; the field values were re-verified by fresh
  regeneration this session (seed 20260811, config-latency.edn),
  byte-identical to the README's own witnessed run. Hand-authored, not
  mechanically generated (contrast docs/dev/pipeline.md's own
  docsgen-regenerated diagrams) -- regenerate by hand if the cited
  section's own field audit changes. ADR-0121.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-label="One HL7v2 message carrying two clocks: EVN-2 clinical time and MSH-7 transmit time, offset by a sampled latency delay">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222" />
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#ffffff" />

  <!-- The message box: one ADT^A01 message, two fields -->
  <rect x="220" y="10" width="200" height="80" rx="8" fill="#eef3fb" stroke="#22314f" stroke-width="2" />
  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#22314f">ADT^A01 — Walker, William</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#44506b">MRN000013</text>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="#5c451c">MSH-7  04:36:46Z</text>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#22492a">EVN-2  03:36:00Z</text>

  <!-- Ground-truth clock (clinical time), top axis -->
  <text x="30" y="140" font-size="13" font-weight="600" fill="#22492a">ground-truth clock (EVN-2, clinical)</text>
  <line x1="30" y1="155" x2="610" y2="155" stroke="#3d6b46" stroke-width="2" marker-end="url(#arrow2)" />
  <circle cx="260" cy="155" r="5" fill="#22492a" />
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#22492a">03:36:00Z — admitted</text>

  <!-- Wire clock (transmit time), bottom axis -->
  <text x="30" y="230" font-size="13" font-weight="600" fill="#5c451c">wire clock (MSH-7, transmit)</text>
  <line x1="30" y1="245" x2="610" y2="245" stroke="#7a5f2e" stroke-width="2" marker-end="url(#arrow2)" />
  <circle cx="470" cy="245" r="5" fill="#5c451c" />
  <text x="470" y="268" text-anchor="middle" font-size="12" fill="#5c451c">04:36:46Z — transmitted</text>

  <!-- Arrow from GT instant to wire instant: the sampled delay -->
  <path d="M262,161 C 320,190 400,200 468,239" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)" />
  <text x="365" y="205" text-anchor="middle" font-size="12" font-style="italic" fill="#222">+1h00m46s sampled delay</text>

  <!-- Ties from message box to each axis point -->
  <path d="M300,90 C 280,110 265,130 260,150" fill="none" stroke="#22492a" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M340,90 C 400,140 450,190 470,240" fill="none" stroke="#5c451c" stroke-width="1" stroke-dasharray="2 2" />
</svg>
